sources:
  heatmap_db:
    kind: cloud-sql-mysql
    project: ${GOOGLE_CLOUD_PROJECT}
    region: ${DB_REGION}
    instance: ${GOOGLE_CLOUD_DB_INSTANCE_NAME}
    database: ${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

tools:
  get_heatmap_color:
    kind: mysql-sql
    source: heatmap_db
    description: >
      Given a region, optional zone, and a raw VM identifier as the TAM said it (a bare family
      name like 'c3', or a compound family+domain identifier like 'c3_standard_lssd' — join with
      underscore first if the TAM said it as two separate words, e.g. 'n2d viperlitepod' ->
      'n2d_viperlitepod'), resolves it against the database and returns the averaged capacity
      heatmap color ('green', 'yellow', 'red', 'very red', or 'no_data').
    parameters:
      - name: region
        type: string
        description: The Google Cloud region name (e.g., 'australia-southeast1'). Required.
      - name: raw_identifier
        type: string
        description: >
          The VM identifier exactly as given by the TAM. Join two separate words with a single
          underscore before passing (e.g. 'n2d viperlitepod' -> 'n2d_viperlitepod'). Otherwise
          pass as-is, unmodified.
      - name: zone
        type: string
        description: The Google Cloud zone name (e.g., 'australia-southeast1-a'). Optional.
        required: false
    statement: |
      SELECT 
        CASE 
          WHEN AVG(percentage_sold) IS NULL THEN 'no_data'
          WHEN AVG(percentage_sold) < 0.40 THEN 'green'
          WHEN AVG(percentage_sold) < 0.70 THEN 'yellow'
          WHEN AVG(percentage_sold) <= 0.90 THEN 'red'
          ELSE 'very red'
        END AS color
      FROM core_count, (
        SELECT ? AS p_region,
               REPLACE(REPLACE(?, '-', '_'), ' ', '_') AS p_raw,
               ? AS p_zone
      ) AS p
      WHERE region = p_region
        AND (p_zone IS NULL OR p_zone = '' OR zone = p_zone)
        AND (
          REPLACE(REPLACE(CONCAT(vm_family, '_', machine_domain), '-', '_'), ' ', '_') = p_raw
          OR REPLACE(machine_domain, ' ', '_') = p_raw
          OR REPLACE(vm_family, ' ', '_') = p_raw
        );